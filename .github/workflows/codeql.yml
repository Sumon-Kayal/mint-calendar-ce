# CodeQL security analysis for the C codebase — runs on pushes and pull requests against
# main, plus a weekly schedule, per GitHub's own recommended setup for compiled languages.
#
# CodeQL needs to observe an actual successful build to analyze C (it traces the real
# compilation). This tree originally needed GTK4 >= 4.21.2 / libadwaita >= 1.8~alpha, above
# what Mint 22 / Ubuntu 24.04 ship, so this used to run on an ubuntu-26.04 runner instead.
# It's since been ported down to run against Mint 22 / Ubuntu 24.04's real GTK4 4.14.5 /
# libadwaita 1.5.0 (see BUILD.md), so this now runs natively on ubuntu-24.04.
#
# Uses CodeQL Action v4 (v3 is being deprecated December 2026).

name: "CodeQL"

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '19 3 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (C)
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential devscripts equivs
          sudo mk-build-deps --install --remove \
            --tool="apt-get -o Debug::pkgProblemResolver=yes -y --no-install-recommends" \
            debian/control

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          languages: c-cpp
          build-mode: none
      - name: Build
        run: |
          meson setup builddir
          ninja -C builddir

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          category: "/language:c-cpp"
