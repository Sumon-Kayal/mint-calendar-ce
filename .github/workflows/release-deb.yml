# Builds a .deb on an Ubuntu 24.04 (Noble) runner and publishes it as a real GitHub Release
# via `gh`.
#
# This tree originally needed GTK4 >= 4.21.2 / libadwaita >= 1.8~alpha, which Mint 22 /
# Ubuntu 24.04's own repos don't carry (they ship 4.14.5 / 1.5.0), so this workflow used to
# build on an ubuntu-26.04 runner instead — see git history / CHANGELOG.md for that approach.
#
# The tree has since been ported down to actually run against Mint 22 / Ubuntu 24.04's real
# GTK4 4.14.5 / libadwaita 1.5.0 (see BUILD.md for the specific compatibility fixes this
# took), so this now builds natively on ubuntu-24.04 — the runner Ubuntu/Mint 22 users will
# actually run the resulting .deb on, no third-party PPA or newer base needed.

name: Build & Release (.deb)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: "Build .deb (Ubuntu 24.04 / Noble base)"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential devscripts equivs

      - name: Install build dependencies from debian/control
        run: |
          sudo mk-build-deps --install --remove \
            --tool="apt-get -o Debug::pkgProblemResolver=yes -y --no-install-recommends" \
            debian/control

      # dpkg-buildpackage runs meson with --wrap-mode=nodownload, so the
      # blueprint-compiler wrap (subprojects/blueprint-compiler.wrap) can't be
      # git-cloned during the actual build. Fetch it here instead, while the
      # job still has network access — once it's on disk, nodownload doesn't
      # block using it, only downloading it.
      - name: Pre-fetch meson subprojects (blueprint-compiler)
        run: meson subprojects download

      - name: Build binary package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect .deb
        run: |
          mkdir -p dist
          mv ../*.deb dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mint-calendar-ce-deb
          path: dist/*.deb

  release:
    name: "Publish native GitHub Release"
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download .deb
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: mint-calendar-ce-deb
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.deb \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
