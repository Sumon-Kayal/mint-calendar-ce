name: Weekly Code Formatting PR

on:
  # 1. Weekly Schedule: Runs every Monday at 00:00 UTC
  schedule:
    - cron: '0 0 * * 1'

  # 2. Manual Trigger: Adds a "Run workflow" button in the Actions tab
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to sanitize'
        required: true
        default: 'main'

permissions: {}

jobs:
  sanitize-and-pr:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # workflow_dispatch supplies target_branch explicitly. schedule runs
          # carry no inputs, so this falls back to github.ref instead of a
          # hardcoded 'main' -- for schedule triggers github.ref always points
          # at the tip of the actual default branch, whatever it's named.
          ref: ${{ github.event.inputs.target_branch || github.ref }}
          persist-credentials: false

      # Step 2: Install formatting & AST tools
      - name: Install Sanitization Tools
        run: |
          sudo apt-get update
          # clang-format and python3-pip versions managed by ubuntu-22.04 base image
          sudo apt-get install -y clang-format python3-pip
          pip install black==24.10.0

      # Step 3: Run Formatters
      - name: Format C/C++ Code
        run: |
          # Scoped to git-tracked files only (matches the Go step below), so
          # build output, vendored/third-party code, and gitignored paths are
          # never touched. No -style flag: clang-format auto-detects a repo's
          # own .clang-format and only falls back to LLVM style if none exists.
          git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' \
            | xargs -0 -r clang-format -i

      - name: Format Python Code
        run: |
          git ls-files -z -- '*.py' | xargs -0 -r black

      - name: Format JS/TS Code
        run: |
          npx --yes prettier@3.3.3 --write "**/*.{js,ts,jsx,tsx,json,md}"

      - name: Format Go Code (if applicable)
        run: |
          if command -v go &> /dev/null; then
            if [ -n "$(git ls-files -z '*.go')" ]; then
              git ls-files -z '*.go' | xargs -0 gofmt -w
            fi
          fi

      # Step 4: Make sure the PR labels exist before create-pull-request tries
      # to apply them -- it errors if a label isn't already on the repo.
      - name: Ensure Labels Exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "automated pr" --color "ededed" --force
          gh label create "formatting" --color "c5def5" --force

      # Step 5: Create PR using official GitHub Action
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: reformat codebase"
          title: "🧹 [Automated] Standardize Code Formatting"
          body: |
            ## Automated Code Formatting
            This PR was automatically generated by the weekly formatting workflow (`weekly-sanitizer.yml`).

            ### Actions Taken:
            * Ran `clang-format` on C/C++ files
            * Ran `black` on Python files
            * Ran `prettier` on JS/TS/JSON/Markdown files
            * Ran `gofmt` on Go files (if present)

            Please review and merge if tests pass!
          branch: "automated/format-codebase"
          delete-branch: true
          labels: |
            automated pr
            formatting
