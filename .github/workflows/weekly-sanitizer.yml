name: Weekly AI Watermark Removal PR

on:
  # 1. Weekly Schedule: Runs every Monday at 00:00 UTC
  schedule:
    - cron: '0 0 * * 1'
  
  # 2. Manual Trigger: Adds a "Run workflow" button in the Actions tab
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to sanitize'
        required: true
        default: 'main'

permissions:
  contents: write
  pull-requests: write

jobs:
  sanitize-and-pr:
    runs-on: ubuntu-22.04

    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || 'main' }}

      # Step 2: Install formatting & AST tools
      - name: Install Sanitization Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format python3-pip
          pip install black

      # Step 3: Run Formatters (Strips statistical token biases)
      - name: Format C/C++ Code
        run: |
          find . -regex '.*\.\(c\|cpp\|h\|hpp\)' -exec clang-format -i -style=LLVM {} + || true

      - name: Format Python Code
        run: |
          black . || true

      - name: Format JS/TS Code
        run: |
          npx prettier --write "**/*.{js,ts,jsx,tsx,json,md}" || true

      - name: Format Go Code (if applicable)
        run: |
          if command -v go &> /dev/null; then gofmt -w .; fi || true

      # Step 4: Create PR using official GitHub Action
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: strip AI watermarks & reformat codebase"
          title: "🧹 [Automated] Strip AI Watermarks & Standardize Formatting"
          body: |
            ## Automated AI Watermark Removal
            This PR was automatically generated by the weekly watermark removal workflow (`weekly-sanitizer.yml`).
            
            ### Actions Taken:
            * Ran AST layout formatters (`clang-format`, `black`, `prettier`, `gofmt`).
            * Reset token distributions and code layouts across the repository.
            * Stripped potential statistical text-level AI watermarks.
            
            Please review and merge if tests pass!
          branch: "automated/strip-ai-watermarks"
          delete-branch: true
          labels: |
            automated pr
            formatting
            
