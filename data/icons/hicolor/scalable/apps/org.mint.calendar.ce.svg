<?xml version="1.0" encoding="UTF-8"?>
<!-- Mint Calendar CE app icon
     Flat, Mint-Y-Dark styled reskin of GNOME Calendar's icon geometry.
     Same silhouette/coordinates as upstream for recognizability; palette
     replaced with a dark flat body + Mint green accent instead of GNOME's
     purple gradient treatment. See BUILD.md/README.md for notes on this
     being a best-effort match to Mint-Y-Dark done without the theme's own
     asset files. -->
